version: "3.9"

# Staging / production stack. Run on etl-node-01 with remote deployment to ai-node-01.
services:
  prefect:
    image: ghcr.io/boyang-li/pap/prefect:latest
    environment:
      PREFECT_API_URL: http://prefect:4200/api
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/var/lib/prefect

  watcher:
    image: ghcr.io/boyang-li/pap/watcher:latest
    env_file:
      - ../.env
    volumes:
      - /srv/pap/raw:/srv/pap/raw
      - /srv/pap/meta:/srv/pap/meta

  courier:
    image: ghcr.io/boyang-li/pap/courier:latest
    env_file:
      - ../.env
    volumes:
      - /srv/pap/summaries:/srv/pap/summaries

  ear:
    image: ghcr.io/boyang-li/pap/ear:latest
    env_file:
      - ../.env
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - video
    environment:
      HSA_OVERRIDE_GFX_VERSION: "11.0.1"
    volumes:
      - /srv/pap/raw:/srv/pap/raw
      - /srv/pap/transcripts:/srv/pap/transcripts

  brain:
    image: ghcr.io/boyang-li/pap/brain:latest
    env_file:
      - ../.env
    depends_on:
      - ear
    volumes:
      - /srv/pap/transcripts:/srv/pap/transcripts
      - /srv/pap/summaries:/srv/pap/summaries

volumes:
  prefect-data:
