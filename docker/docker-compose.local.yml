version: "3.9"

# Local developer stack (MBP) with Prefect + Postgres + CPU mocks.
services:
  prefect-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: prefect
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
    ports:
      - "5432:5432"
    volumes:
      - prefect-db-data:/var/lib/postgresql/data

  prefect-server:
    image: prefecthq/prefect:2-python3.11
    depends_on:
      - prefect-db
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@prefect-db:5432/prefect
      PREFECT_API_URL: http://localhost:4200/api
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_API_PORT: "4200"
      PREFECT_SERVER_SERVICES_SCHEDULER_ENABLED: "true"
    ports:
      - "4200:4200"
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--log-level", "info"]

  prefect-worker-default:
    image: prefecthq/prefect:2-python3.11
    depends_on:
      - prefect-server
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_LOGGING_LEVEL: INFO
    command: ["prefect", "worker", "start", "--pool", "default", "--name", "local-dev"]

  watcher-dev:
    build:
      context: ..
      dockerfile: docker/local.Dockerfile
    command: ["python", "-m", "watcher.mock"]
    volumes:
      - ../config:/app/config:ro
      - ../data/raw:/data/raw
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      - prefect-worker-default

  ear-mock:
    image: python:3.11-slim
    command: ["sleep", "infinity"]

  brain-mock:
    image: python:3.11-slim
    command: ["sleep", "infinity"]

  courier-dev:
    image: python:3.11-slim
    command: ["sleep", "infinity"]

networks:
  default:
    name: pap-local

volumes:
  prefect-db-data:
