version: "3.9"

services:
  prefect-worker-gpu:
    image: prefecthq/prefect:2-python3.11
    env_file:
      - ../../.env
    environment:
      PREFECT_API_URL: http://192.168.2.81:4200/api
    command: ["prefect", "worker", "start", "--pool", "gpu", "--name", "staging-tier3"]

  ear:
    image: ghcr.io/boyang-li/pap/ear:${IMAGE_TAG-staging}
    env_file:
      - ../../.env
    environment:
      HSA_OVERRIDE_GFX_VERSION: "11.0.1"
      PAP_STORAGE_ROOT: ${PAP_STORAGE_ROOT-/srv/pap}
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - video
    volumes:
      - ${PAP_STORAGE_ROOT-/srv/pap}/raw:/data/raw:ro
      - ${PAP_STORAGE_ROOT-/srv/pap}/transcripts:/data/transcripts
    ports:
      - "8000:8000"

  brain:
    image: ghcr.io/boyang-li/pap/brain:${IMAGE_TAG-staging}
    env_file:
      - ../../.env
    environment:
      PAP_STORAGE_ROOT: ${PAP_STORAGE_ROOT-/srv/pap}
    depends_on:
      - ear
    volumes:
      - ${PAP_STORAGE_ROOT-/srv/pap}/transcripts:/data/transcripts:ro
      - ${PAP_STORAGE_ROOT-/srv/pap}/summaries:/data/summaries
    ports:
      - "8100:8100"

  ollama:
    image: ollama/ollama:0.1.32
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
