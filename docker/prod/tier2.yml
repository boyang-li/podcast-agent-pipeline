version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.7.3
    volumes:
      - qdrant-data:/qdrant/storage
      - /srv/pap/vector_backups:/backups
    ports:
      - "6333:6333"
    restart: unless-stopped

  prefect-worker-logic:
    image: prefecthq/prefect:3-python3.12
    env_file:
      - ../../.env
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL-http://192.168.2.81:4200/api}
    command: ["prefect", "worker", "start", "--pool", "logic", "--name", "prod-tier2"]
    restart: unless-stopped

volumes:
  qdrant-data:
