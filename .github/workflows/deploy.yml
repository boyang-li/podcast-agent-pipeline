name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      promote_prod:
        description: "Promote this commit to production"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io/boyang-li/pap
  SERVICES: watcher courier ear brain

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push images
    runs-on: [self-hosted, etl-node-01]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push service images
        run: |
          set -euo pipefail
          for service in $SERVICES; do
            docker buildx build \
              --platform linux/amd64 \
              --push \
              -f docker/Dockerfile.${service} \
              -t ${REGISTRY}/${service}:${GITHUB_SHA} \
              -t ${REGISTRY}/${service}:${GITHUB_SHA}-staging \
              .
          done

  deploy-staging:
    name: Deploy to staging
    runs-on: [self-hosted, etl-node-01]
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Copy staging environment file
        run: |
          cp /opt/pap/podcast-agent-pipeline/.env .env

      - name: Pull and restart staging tiers
        env:
          IMAGE_TAG: ${{ github.sha }}-staging
        run: |
          set -euo pipefail
          for tier in tier1 tier2 tier3; do
            compose_file="docker/staging/${tier}.yml"
            if [ -f "$compose_file" ]; then
              IMAGE_TAG=${IMAGE_TAG} docker compose -f "$compose_file" pull
              IMAGE_TAG=${IMAGE_TAG} docker compose -f "$compose_file" up -d --remove-orphans
            fi
          done

      - name: Health checks
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 5 http://192.168.2.81:8200/health
          curl --retry 5 --retry-all-errors --retry-delay 5 http://192.168.2.82:8000/health
          curl --retry 5 --retry-all-errors --retry-delay 5 http://192.168.2.82:8100/health

      - name: Cleanup env copy
        if: always()
        run: rm -f .env

  deploy-prod:
    name: Promote to production
    runs-on: [self-hosted, etl-node-01]
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote_prod == 'true'
    environment:
      name: production
      url: http://192.168.2.81:4200/
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Promote images to latest
        run: |
          set -euo pipefail
          for service in $SERVICES; do
            docker pull ${REGISTRY}/${service}:${GITHUB_SHA}
            docker tag ${REGISTRY}/${service}:${GITHUB_SHA} ${REGISTRY}/${service}:latest
            docker push ${REGISTRY}/${service}:latest
          done

      - name: Copy production environment file
        run: |
          cp /opt/pap/podcast-agent-pipeline/.env .env

      - name: Pull and restart production tiers
        env:
          IMAGE_TAG: latest
        run: |
          set -euo pipefail
          for tier in tier1 tier2 tier3; do
            compose_file="docker/prod/${tier}.yml"
            if [ -f "$compose_file" ]; then
              IMAGE_TAG=${IMAGE_TAG} docker compose -f "$compose_file" pull
              IMAGE_TAG=${IMAGE_TAG} docker compose -f "$compose_file" up -d --remove-orphans
            fi
          done

      - name: Production health checks
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 5 http://192.168.2.81:8200/health
          curl --retry 5 --retry-all-errors --retry-delay 5 http://192.168.2.82:8000/health
          curl --retry 5 --retry-all-errors --retry-delay 5 http://192.168.2.82:8100/health

      - name: Cleanup env copy
        if: always()
        run: rm -f .env
