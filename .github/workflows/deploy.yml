name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/boyang-li/pap
  SERVICES: watcher courier ear brain
  PREFECT_API_URL: ${{ vars.PREFECT_API_URL }}
  PREFECT_SERVER_API_URL: ${{ vars.PREFECT_SERVER_API_URL }}
  PREFECT_UI_URL: ${{ vars.PREFECT_UI_URL }}
  PREFECT_UI_API_URL: ${{ vars.PREFECT_UI_API_URL }}
  PREFECT_DB_NAME: ${{ vars.PREFECT_DB_NAME }}
  PREFECT_DB_USER: ${{ vars.PREFECT_DB_USER }}
  PREFECT_DB_PASSWORD: ${{ vars.PREFECT_DB_PASSWORD }}
  OLLAMA_HOST: ${{ vars.OLLAMA_HOST }}
  EAR_ENDPOINT: ${{ vars.EAR_ENDPOINT }}
  BRAIN_ENDPOINT: ${{ vars.BRAIN_ENDPOINT }}
  COURIER_ENDPOINT: ${{ vars.COURIER_ENDPOINT }}
  PAP_STORAGE_ROOT: ${{ vars.PAP_STORAGE_ROOT }}
  WATCHER_API_KEY: ${{ vars.WATCHER_API_KEY }}
  EAR_API_KEY: ${{ vars.EAR_API_KEY }}
  BRAIN_API_KEY: ${{ vars.BRAIN_API_KEY }}
  COURIER_API_KEY: ${{ vars.COURIER_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push images
    runs-on: [self-hosted, etl-node-01]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push service images
        run: |
          set -euo pipefail
          for service in $SERVICES; do
            docker buildx build \
              --platform linux/amd64 \
              --push \
              -f docker/Dockerfile.${service} \
              -t ${REGISTRY}/${service}:${GITHUB_SHA} \
              -t ${REGISTRY}/${service}:latest \
              .
          done

  deploy-prod-tier1:
    name: Deploy prod tier1
    runs-on: [self-hosted, etl-node-01]
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Generate production environment file
        run: |
          cat <<EOF > .env
          PREFECT_API_URL=${PREFECT_API_URL}
          PREFECT_SERVER_API_URL=${PREFECT_SERVER_API_URL}
          PREFECT_UI_URL=${PREFECT_UI_URL}
          PREFECT_UI_API_URL=${PREFECT_UI_API_URL}
          PREFECT_DB_NAME=${PREFECT_DB_NAME}
          PREFECT_DB_USER=${PREFECT_DB_USER}
          PREFECT_DB_PASSWORD=${PREFECT_DB_PASSWORD}
          OLLAMA_HOST=${OLLAMA_HOST}
          EAR_ENDPOINT=${EAR_ENDPOINT}
          BRAIN_ENDPOINT=${BRAIN_ENDPOINT}
          COURIER_ENDPOINT=${COURIER_ENDPOINT}
          PAP_STORAGE_ROOT=${PAP_STORAGE_ROOT}
          WATCHER_API_KEY=${WATCHER_API_KEY}
          EAR_API_KEY=${EAR_API_KEY}
          BRAIN_API_KEY=${BRAIN_API_KEY}
          COURIER_API_KEY=${COURIER_API_KEY}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
          EOF

      - name: Pull and restart prod tier1
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          compose_file="docker/prod/tier1.yml"
          IMAGE_TAG=${IMAGE_TAG} docker compose -f "$compose_file" pull
          IMAGE_TAG=${IMAGE_TAG} docker compose -f "$compose_file" up -d --remove-orphans

      - name: Health checks (tier1 services)
        run: |
          for i in {1..12}; do
            if curl -fs http://192.168.2.81:8200/health; then
              exit 0
            fi
            sleep 5
          done
          echo "Courier service failed to become healthy" >&2
          exit 1

      - name: Cleanup env copy
        if: always()
        run: rm -f .env

  deploy-prod-tier2:
    name: Deploy prod tier2
    runs-on: [self-hosted, mid-node-01]
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Generate production environment file
        run: |
          cat <<EOF > .env
          PREFECT_API_URL=${PREFECT_API_URL}
          PREFECT_SERVER_API_URL=${PREFECT_SERVER_API_URL}
          PREFECT_UI_URL=${PREFECT_UI_URL}
          PREFECT_UI_API_URL=${PREFECT_UI_API_URL}
          PREFECT_DB_NAME=${PREFECT_DB_NAME}
          PREFECT_DB_USER=${PREFECT_DB_USER}
          PREFECT_DB_PASSWORD=${PREFECT_DB_PASSWORD}
          OLLAMA_HOST=${OLLAMA_HOST}
          EAR_ENDPOINT=${EAR_ENDPOINT}
          BRAIN_ENDPOINT=${BRAIN_ENDPOINT}
          COURIER_ENDPOINT=${COURIER_ENDPOINT}
          PAP_STORAGE_ROOT=${PAP_STORAGE_ROOT}
          WATCHER_API_KEY=${WATCHER_API_KEY}
          EAR_API_KEY=${EAR_API_KEY}
          BRAIN_API_KEY=${BRAIN_API_KEY}
          COURIER_API_KEY=${COURIER_API_KEY}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
          EOF

      - name: Pull and restart prod tier2
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          compose_file="docker/prod/tier2.yml"
          IMAGE_TAG=${IMAGE_TAG} docker compose -f "$compose_file" pull
          IMAGE_TAG=${IMAGE_TAG} docker compose -f "$compose_file" up -d --remove-orphans

      - name: Cleanup env copy
        if: always()
        run: rm -f .env

  deploy-prod-tier3:
    name: Deploy prod tier3
    runs-on: [self-hosted, ai-node-01]
    needs:
      - build-and-push
      - deploy-prod-tier1
      - deploy-prod-tier2
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Generate production environment file
        run: |
          cat <<EOF > .env
          PREFECT_API_URL=${PREFECT_API_URL}
          PREFECT_SERVER_API_URL=${PREFECT_SERVER_API_URL}
          PREFECT_UI_URL=${PREFECT_UI_URL}
          PREFECT_UI_API_URL=${PREFECT_UI_API_URL}
          PREFECT_DB_NAME=${PREFECT_DB_NAME}
          PREFECT_DB_USER=${PREFECT_DB_USER}
          PREFECT_DB_PASSWORD=${PREFECT_DB_PASSWORD}
          OLLAMA_HOST=${OLLAMA_HOST}
          EAR_ENDPOINT=${EAR_ENDPOINT}
          BRAIN_ENDPOINT=${BRAIN_ENDPOINT}
          COURIER_ENDPOINT=${COURIER_ENDPOINT}
          PAP_STORAGE_ROOT=${PAP_STORAGE_ROOT}
          WATCHER_API_KEY=${WATCHER_API_KEY}
          EAR_API_KEY=${EAR_API_KEY}
          BRAIN_API_KEY=${BRAIN_API_KEY}
          COURIER_API_KEY=${COURIER_API_KEY}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
          EOF

      - name: Pull and restart prod tier3
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          compose_file="docker/prod/tier3.yml"
          IMAGE_TAG=${IMAGE_TAG} docker compose -f "$compose_file" pull
          IMAGE_TAG=${IMAGE_TAG} docker compose -f "$compose_file" up -d --remove-orphans

      - name: Health checks (tier3 services)
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 5 http://127.0.0.1:8000/health
          curl --retry 5 --retry-all-errors --retry-delay 5 http://127.0.0.1:8100/health

      - name: Cleanup env copy
        if: always()
        run: rm -f .env
